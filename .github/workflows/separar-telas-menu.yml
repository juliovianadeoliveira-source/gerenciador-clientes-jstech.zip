name: Separar telas do menu lateral

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  separate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar separação das telas
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          marker = '\n/* JSTECH_SEPARATED_MENU */\n'
          if marker not in text:
              patch = r'''
/* JSTECH_SEPARATED_MENU */
(function(){
  function showMenuScreen(filter){
    const main=document.querySelector('main');
    if(!main)return;
    const analytics=main.querySelector('.analytics');
    const monthly=main.querySelector('.monthly-report');
    const summary=main.querySelector('.summary-grid');
    const panels=[...main.querySelectorAll(':scope > section.panel')];
    const clientPanel=panels.find(p=>p.id!=='resellersSection'&&p.id!=='androidAppsSection');
    const resellers=document.getElementById('resellersSection');
    const apps=document.getElementById('androidAppsSection');
    if(filter==='todos'){
      if(analytics)analytics.hidden=false;
      if(monthly)monthly.hidden=false;
      if(summary)summary.hidden=false;
      if(clientPanel)clientPanel.hidden=true;
      if(resellers)resellers.hidden=true;
      if(apps)apps.hidden=true;
      const title=main.querySelector('.topbar h1');
      if(title)title.textContent='Controle de vencimentos';
      return;
    }
    if(analytics)analytics.hidden=true;
    if(monthly)monthly.hidden=true;
    if(summary)summary.hidden=true;
    if(resellers)resellers.hidden=true;
    if(apps)apps.hidden=true;
    if(clientPanel)clientPanel.hidden=false;
    const titles={hoje:'Vencem hoje',amanha:'Vencem amanhã',proximos:'Próximos 5 dias',vencidos:'Clientes vencidos',ativos:'Clientes ativos',cancelados:'Clientes cancelados'};
    const title=main.querySelector('.topbar h1');
    if(title)title.textContent=titles[filter]||'Clientes';
    window.activeFilter=filter;
    if(typeof render==='function')render();
  }

  function bindSeparatedMenu(){
    document.querySelectorAll('.sidebar .nav-item[data-filter]').forEach(btn=>{
      btn.addEventListener('click',function(ev){
        ev.preventDefault();
        ev.stopImmediatePropagation();
        document.querySelectorAll('.sidebar .nav-item').forEach(x=>x.classList.remove('active'));
        btn.classList.add('active');
        activeFilter=btn.dataset.filter||'todos';
        showMenuScreen(activeFilter);
      },true);
    });
    showMenuScreen(activeFilter||'todos');
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bindSeparatedMenu);
  else bindSeparatedMenu();
})();
'''
              path.write_text(text+marker+patch,encoding='utf-8')

      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/separar-telas-menu.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separa telas do menu lateral [skip ci]"
          git push
