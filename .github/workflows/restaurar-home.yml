name: Restaurar home antiga

on: push

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar restauração
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          marker='<!-- JSTECH_OLD_HOME -->'
          if marker not in text:
              home='''
          <!-- JSTECH_OLD_HOME -->
          <section id="oldHomeSection" class="old-home">
            <div class="old-home-title"><div><p class="eyebrow">Painel principal</p><h2>💰 Financeiro e alertas</h2></div></div>
            <div class="old-finance-grid">
              <article><span>Pagos</span><strong id="oldPaid">0</strong></article>
              <article><span>Pendentes</span><strong id="oldPending">0</strong></article>
              <article><span>Atrasados</span><strong id="oldOverdue">0</strong></article>
              <article><span>Recebido</span><strong id="oldReceived">R$ 0,00</strong></article>
              <article><span>Custos</span><strong id="oldCosts">R$ 0,00</strong></article>
              <article><span>Lucro estimado</span><strong id="oldProfit">R$ 0,00</strong></article>
            </div>
            <div class="old-home-actions">
              <button class="primary" id="oldSearchBtn" type="button">🔎 Busca completa</button>
              <button class="ghost" id="oldPixBtn" type="button">💠 Configurar Pix</button>
              <button class="ghost" id="oldReportBtn" type="button">📊 Relatório mensal</button>
              <button class="ghost" id="oldBackupBtn" type="button">💾 Backup agora</button>
              <button class="primary" id="oldAppsBtn" type="button">🚀 Ativar aplicativo</button>
            </div>
            <section class="panel old-client-panel">
              <div class="panel-head"><div><h2>Clientes</h2></div><button class="primary" id="oldNewClientBtn" type="button">+ Adicionar cliente</button></div>
              <div class="table-wrap"><table class="old-client-table"><thead><tr><th>Cliente</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead><tbody id="oldClientRows"></tbody></table><div id="oldEmptyState" class="empty" hidden><h3>Nenhum cliente cadastrado</h3></div></div>
            </section>
          </section>
          '''
              marker2='<section class="analytics"'
              if marker2 not in text: raise SystemExit('analytics não encontrada')
              text=text.replace(marker2,home+'      '+marker2,1)
              index.write_text(text,encoding='utf-8')

          js=Path('app.js')
          text=js.read_text(encoding='utf-8')
          marker='\n/* JSTECH_OLD_HOME_LOGIC */\n'
          if marker not in text:
              patch=r'''
          /* JSTECH_OLD_HOME_LOGIC */
          (function(){
            function hs(c){if(c.cancelled)return{label:'Cancelado',cls:'gray',overdue:false};if(c.lifetime)return{label:'Ativo',cls:'green',overdue:false};const d=diffDays(c.dueDate);return d<0?{label:'Atrasado',cls:'red',overdue:true}:{label:'Pendente',cls:'amber',overdue:false}}
            function renderOldHome(){const rows=document.getElementById('oldClientRows');if(!rows||typeof clients==='undefined')return;const list=clients.filter(c=>!c.cancelled).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));const paid=list.filter(c=>c.payment==='paid'||c.payment_status==='paid'||c.status==='paid'),over=list.filter(c=>!c.lifetime&&diffDays(c.dueDate)<0),pending=list.filter(c=>!paid.includes(c)&&!c.lifetime&&diffDays(c.dueDate)>=0),received=paid.reduce((t,c)=>t+Number(c.value||0),0),costs=list.reduce((t,c)=>t+Number(c.cost||0),0);document.getElementById('oldPaid').textContent=paid.length;document.getElementById('oldPending').textContent=pending.length;document.getElementById('oldOverdue').textContent=over.length;document.getElementById('oldReceived').textContent=money(received);document.getElementById('oldCosts').textContent=money(costs);document.getElementById('oldProfit').textContent=money(received-costs);rows.innerHTML=list.map(c=>{const s=hs(c),a=s.overdue?`<div class="old-actions"><button onclick="renewClient('${c.id}')">Pago</button><button onclick="sendCharge('${c.id}')">Cobrar</button><button onclick="showHistory('${c.id}')">Histórico</button></div>`:'';return `<tr><td><strong>${escapeHTML(c.name)}</strong></td><td>${c.lifetime?'Vitalício':dateBR(c.dueDate)}</td><td><span class="badge ${s.cls}">${s.label}</span></td><td>${a}</td></tr>`}).join('');const e=document.getElementById('oldEmptyState');if(e)e.hidden=list.length!==0}
            window.renderOldHome=renderOldHome;
            function bind(){const m=(id,f)=>{const e=document.getElementById(id);if(e&&!e.dataset.bound){e.dataset.bound='1';e.addEventListener('click',f)}};m('oldNewClientBtn',()=>document.getElementById('newClientBtn')?.click());m('oldBackupBtn',()=>document.getElementById('exportBtn')?.click());m('oldAppsBtn',()=>document.querySelector('.sidebar .nav-item[data-view="apps"]')?.click());m('oldSearchBtn',()=>document.getElementById('searchInput')?.focus());m('oldReportBtn',()=>{const e=document.querySelector('.monthly-report');if(e){e.hidden=false;e.scrollIntoView({behavior:'smooth'})}});m('oldPixBtn',()=>typeof showToast==='function'&&showToast('Configuração do Pix disponível no cadastro de recebimento.'))}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{renderOldHome();bind()});else{renderOldHome();bind()}
          })();
          '''
              js.write_text(text+marker+patch,encoding='utf-8')

          css=Path('styles.css')
          text=css.read_text(encoding='utf-8')
          marker='\n/* JSTECH_OLD_HOME_STYLE */\n'
          if marker not in text:
              css.write_text(text+marker+r'''
          /* JSTECH_OLD_HOME_STYLE */
          .old-home{margin-bottom:24px}.old-home-title{margin-bottom:14px}.old-home-title h2{margin:0;font-size:22px}.old-finance-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}.old-finance-grid article{background:#0d1a2c;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px}.old-finance-grid span{display:block;color:#9aa9bd;font-size:12px;margin-bottom:7px}.old-finance-grid strong{font-size:22px;color:#f6f8fc}.old-home-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.old-client-panel{margin-top:0}.old-client-table th,.old-client-table td{padding:10px 12px}.old-actions{display:flex;gap:6px;flex-wrap:wrap}.old-actions button{border:0;border-radius:7px;padding:7px 10px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}.old-actions button:first-child{background:#16a34a}.old-actions button:last-child{background:#e5e7eb;color:#111827}.badge.red{background:#7f1d1d;color:#fecaca}.badge.amber{background:#78350f;color:#fde68a}.badge.green{background:#14532d;color:#bbf7d0}.badge.gray{background:#374151;color:#d1d5db}@media(max-width:1100px){.old-finance-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.old-finance-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          ''',encoding='utf-8')

          # Corrige a navegação já criada anteriormente para que a home antiga seja a tela inicial.
          wf=Path('.github/workflows/separar-telas-menu.yml')
          if wf.exists():
              w=wf.read_text(encoding='utf-8')
              w=w.replace("if(filter==='todos'){\n      if(analytics)analytics.hidden=false;\n      if(monthly)monthly.hidden=false;\n      if(summary)summary.hidden=false;\n      if(clientPanel)clientPanel.hidden=true;", "if(filter==='todos'){\n      const home=document.getElementById('oldHomeSection');\n      if(home)home.hidden=false;\n      if(analytics)analytics.hidden=true;\n      if(monthly)monthly.hidden=true;\n      if(summary)summary.hidden=true;\n      if(clientPanel)clientPanel.hidden=true;")
              w=w.replace("if(analytics)analytics.hidden=true;\n    if(monthly)monthly.hidden=true;", "const home=document.getElementById('oldHomeSection');\n    if(home)home.hidden=true;\n    if(analytics)analytics.hidden=true;\n    if(monthly)monthly.hidden=true;")
              wf.write_text(w,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css .github/workflows/separar-telas-menu.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restaura home financeira antiga [skip ci]"
          git push
