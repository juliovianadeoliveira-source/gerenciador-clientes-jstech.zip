name: Ativar correcao da interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir arquivos de interface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'ui-fix.css?v=20260906-1' not in s:
              s=s.replace('</head>','  <link rel="stylesheet" href="ui-fix.css?v=20260906-1">\n</head>',1)
          if 'ui-fix.js?v=20260906-1' not in s:
              s=s.replace('</body>','  <script src="ui-fix.js?v=20260906-1"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar alteracao
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Corrigir navegacao e separar telas [skip ci]'
          git push
