name: Remover home financeira antiga
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
permissions:
  contents: write
jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover bloco da home antiga
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'\s*<!-- JSTECH_OLD_HOME -->.*?(?=\s*<section class="analytics")', '\n', s, count=1, flags=re.S)
          s2=s2.replace('  <link rel="stylesheet" href="ui-fix.css?v=20260906-1">\n','')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q 'JSTECH_OLD_HOME' index.html && { echo 'Bloco antigo ainda existe'; exit 1; } || true
      - name: Publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remover home financeira da pagina principal [skip ci]'
          git push
